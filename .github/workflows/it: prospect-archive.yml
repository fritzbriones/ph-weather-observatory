
name: Daily prospective-window forecast snapshot
# Records issued forecasts (inputs only) during the 2026-12-01..2027-05-29
# prospective window. Strictly additive: only writes prospect-archive/snapshots/.
on:
  schedule:
    - cron: "35 16 * * *"   # 16:35 UTC = 00:35 Asia/Manila, captures the full completed day
  workflow_dispatch: {}      # allows manual runs
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect yesterday's forecast snapshot (19 cities)
        run: python3 prospect-archive/collect_snapshot.py
      - name: Commit new snapshots
        run: |
          git config user.name "archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prospect-archive/snapshots/
          git diff --cached --quiet && echo "no new data" && exit 0
          git commit -m "prospect-archive: snapshot $(date -u +%F)"
          git push
